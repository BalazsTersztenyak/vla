[project]
name = "vla"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mani-skill",
    "numpy",
    "pillow",
    "scipy",
    "gymnasium",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
vla = [
    "transformers>=4.46.0,<5.0",
    "timm>=0.9.10,<1.0",
    "tokenizers",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock",
]

[tool.pytest.ini_options]
markers = [
    "gpu: requires CUDA GPU and the VLA model",
    "slow: long-running test",
    "integration: requires SAPIEN/ManiSkill",
]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
